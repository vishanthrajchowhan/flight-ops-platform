resources:
  jobs:
    flightops_medallion_daily:
      name: flightops_medallion_daily
      description: "Medallion pipeline: Auto Loader bronze → silver flights → gold metrics. Triggered monthly by ADF pl_monthly_bts_refresh."
      max_concurrent_runs: 1
      tags:
        project: flightops
        managed_by: databricks-asset-bundle

      email_notifications:
        on_failure:
          - lavudya.vishanth@gmail.com

      job_clusters:
        - job_cluster_key: flightops_job_cluster
          new_cluster:
            kind: CLASSIC_PREVIEW
            is_single_node: true
            data_security_mode: DATA_SECURITY_MODE_DEDICATED
            spark_version: 17.3.x-scala2.13
            node_type_id: Standard_D4a_v4
            runtime_engine: STANDARD
            custom_tags:
              project: flightops

      tasks:
        - task_key: bronze_autoloader
          job_cluster_key: flightops_job_cluster
          notebook_task:
            notebook_path: ../src/notebooks/bronze/01_bronze_bts_autoloader.ipynb

        - task_key: silver_flights
          depends_on:
            - task_key: bronze_autoloader
          job_cluster_key: flightops_job_cluster
          notebook_task:
            notebook_path: ../src/notebooks/silver/02_silver_flights.ipynb

        - task_key: gold_metrics
          depends_on:
            - task_key: silver_flights
          job_cluster_key: flightops_job_cluster
          notebook_task:
            notebook_path: ../src/notebooks/gold/03_gold_metrics.ipynb
