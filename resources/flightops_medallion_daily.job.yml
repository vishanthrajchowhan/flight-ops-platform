resources:
  jobs:
    flightops_medallion_daily:
      name: flightops_medallion_daily
      job_clusters:
        - job_cluster_key: flightops_job_cluster
          new_cluster:
            cluster_name: ""
            custom_tags:
              "project": "flightops"
            data_security_mode: DATA_SECURITY_MODE_DEDICATED
            is_single_node: true
            kind: CLASSIC_PREVIEW
            node_type_id: Standard_D4a_v4
            runtime_engine: STANDARD
            spark_version: 17.3.x-scala2.13
      tasks:
        - task_key: bronze_autoloader
          job_cluster_key: flightops_job_cluster
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: src/notebooks/bronze/01_bronze_bts_autoloader
            source: GIT
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: silver_flights
          depends_on:
            - task_key: bronze_autoloader
          job_cluster_key: flightops_job_cluster
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: src/notebooks/silver/02_silver_flights
            source: GIT
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: gold_metrics
          depends_on:
            - task_key: silver_flights
          job_cluster_key: flightops_job_cluster
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: src/notebooks/gold/03_gold_metrics
            source: GIT
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
      description: 'Daily medallion pipeline: Auto Loader bronze → silver flights → gold metrics'
      email_notifications:
        no_alert_for_skipped_runs: false
        on_failure:
          - lavudya.vishanth@gmail.com
        on_success:
          - lavudya.vishanth@gmail.com
      git_source:
        git_branch: main
        git_provider: gitHub
        git_url: https://github.com/vishanthrajchowhan/flight-ops-platform
      max_concurrent_runs: 1
      notification_settings:
        no_alert_for_canceled_runs: false
        no_alert_for_skipped_runs: false
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
